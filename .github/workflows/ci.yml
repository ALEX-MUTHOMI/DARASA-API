name: Darasa-Core CI

on:
  push:
    branches: ["main", "staging", "development"]
  pull_request:
    branches: ["main", "staging", "development"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.3"

jobs:
  validate:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate pyproject.toml syntax
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          with pathlib.Path("pyproject.toml").open("rb") as fh:
              tomllib.load(fh)

          print("pyproject.toml is valid")
          PY

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Verify Python source syntax
        run: python -m compileall app

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry and virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: ${{ runner.os }}-poetry-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Poetry
        run: python -m pip install "poetry==${POETRY_VERSION}"

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-root --with dev

      - name: Black check
        run: poetry run black --check app

      - name: isort check
        run: poetry run isort --check-only app

      - name: Flake8
        run: poetry run flake8 app

  django-smoke:
    name: Django Smoke Check
    runs-on: ubuntu-latest
    needs: lint
    env:
      DJANGO_SETTINGS_MODULE: darasa_project.settings
      SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
      DEBUG: "0"
      TESTING: "1"
      DATABASE_URL: sqlite:///${{ github.workspace }}/app/test_db.sqlite3
      JWT_SIGNING_KEY: ci-jwt-signing-key-0123456789abcdef
      FERNET_ENCRYPTION_KEY: ci-fernet-key-placeholder
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_LOG_LEVEL: WARNING
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry and virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: ${{ runner.os }}-poetry-${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Poetry
        run: python -m pip install "poetry==${POETRY_VERSION}"

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-root --with dev

      - name: Django system checks
        run: poetry run python app/manage.py check

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: django-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate CI .env
        run: |
          cat > .env <<'EOF'
          DJANGO_SETTINGS_MODULE=darasa_project.settings
          SECRET_KEY=ci-secret-key-0123456789abcdef0123456789abcdef
          DEBUG=0
          TESTING=1
          DATABASE_URL=sqlite:////tmp/darasa-ci.sqlite3
          DB_HOST=db
          DB_PORT=5432
          DB_NAME=darasa_ci
          DB_USER=darasa_ci_user
          DB_PASS=ci_db_pass
          REDIS_URL=redis://redis:6379/1
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          JWT_SIGNING_KEY=ci-jwt-signing-key-0123456789abcdef
          FERNET_ENCRYPTION_KEY=ci-fernet-key-placeholder
          ALLOWED_HOSTS=localhost,127.0.0.1,app,0.0.0.0
          DJANGO_LOG_LEVEL=WARNING
          EOF

      - name: Build application images
        run: docker compose build app test
        timeout-minutes: 20

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate
      - lint
      - django-smoke
      - docker-build
    steps:
      - name: Evaluate results
        run: |
          echo "validate=${{ needs.validate.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "django-smoke=${{ needs.django-smoke.result }}"
          echo "docker-build=${{ needs.docker-build.result }}"

          if [[ "${{ needs.validate.result }}" != "success" || \
                "${{ needs.lint.result }}" != "success" || \
                "${{ needs.django-smoke.result }}" != "success" || \
                "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "CI gate failed."
            exit 1
          fi

          echo "All CI gates passed."
