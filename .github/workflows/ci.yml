name: "Darasa-Core — Diagnostic CI Pipeline"

on:
  push:
    branches: ["main", "staging", "development"]
  pull_request:
    branches: ["main", "staging"]

# Cancel in-flight runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: BUILD — Build images once, cache layers for all downstream jobs
  # ============================================================================
  build:
    name: "🏗️ Build Images"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate CI .env
        run: |
          cat > .env << 'EOF'
          DJANGO_SETTINGS_MODULE=darasa_project.settings
          SECRET_KEY=${{ secrets.SECRET_KEY || 'ci-insecure-key-aabbccddeeff00112233445566778899' }}
          DEBUG=0
          ALLOWED_HOSTS=localhost,127.0.0.1,app,0.0.0.0
          DB_HOST=db
          DB_PORT=5432
          DB_NAME=${{ secrets.DB_NAME || 'darasa_ci' }}
          DB_USER=${{ secrets.DB_USER || 'darasa_ci_user' }}
          DB_PASS=${{ secrets.DB_PASS || 'ci_db_pass_not_used_externally' }}
          REDIS_URL=redis://redis:6379/1
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          JWT_SIGNING_KEY=${{ secrets.JWT_SIGNING_KEY || 'ci-jwt-signing-key-must-be-32-bytes-min!!' }}
          FERNET_SECRET_KEY=${{ secrets.FERNET_SECRET_KEY || 'ci-fernet-key-replace-in-real-env-AAAA=' }}
          TENANT_DEFAULT_SCHEMA=public
          TOXIPROXY_HOST=toxiproxy
          TOXIPROXY_API_PORT=8474
          TOXIPROXY_DB_PORT=5433
          TOXIPROXY_REDIS_PORT=6380
          EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
          DJANGO_LOG_LEVEL=WARNING
          TURNSTILE_SECRET_KEY=ci-turnstile-stub
          IP_HASH_SALT=ci-ip-salt-stub-32chars-aabbccddee
          CURRENT_TOS_VERSION=2026-05
          TESTING=1
          EOF
          sed -i 's/^[[:space:]]*//' .env
          echo "✅ .env written ($(wc -l < .env) vars)"

      - name: Build Docker images (parallel)
        run: docker compose build --parallel
        timeout-minutes: 20

      - name: Save image cache metadata
        run: docker compose images

  # ============================================================================
  # JOB 2: LINT — Flake8 + Black check (ALWAYS runs, never blocks others)
  # ============================================================================
  lint:
    name: "🔍 Lint & Format"
    runs-on: ubuntu-latest
    needs: build
    # DIAGNOSTIC: lint result is reported even if other jobs fail
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI .env
        run: |
          cat > .env << 'EOF'
          DJANGO_SETTINGS_MODULE=darasa_project.settings
          SECRET_KEY=ci-insecure-key-aabbccddeeff00112233445566778899
          DEBUG=0
          DB_HOST=db
          DB_NAME=darasa_ci
          DB_USER=darasa_ci_user
          DB_PASS=ci_db_pass
          REDIS_URL=redis://redis:6379/1
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          JWT_SIGNING_KEY=ci-jwt-signing-key-must-be-32-bytes-min!!
          FERNET_SECRET_KEY=ci-fernet-key-replace-in-real-env-AAAA=
          TENANT_DEFAULT_SCHEMA=public
          TOXIPROXY_HOST=toxiproxy
          TOXIPROXY_API_PORT=8474
          TOXIPROXY_DB_PORT=5433
          TOXIPROXY_REDIS_PORT=6380
          EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
          DJANGO_LOG_LEVEL=WARNING
          TESTING=1
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Build images
        run: docker compose build --parallel
        timeout-minutes: 20

      - name: "flake8 — PEP-8 & security lint"
        run: docker compose run --rm test flake8
        timeout-minutes: 5

      - name: "black — formatting check"
        run: docker compose run --rm --entrypoint="" test python -m black --check --diff .
        timeout-minutes: 5

      - name: "isort — import order check"
        run: docker compose run --rm --entrypoint="" test python -m isort --check-only --diff .
        timeout-minutes: 5

  # ============================================================================
  # JOB 3: UNIT & INTEGRATION TESTS
  # ============================================================================
  test-unit:
    name: "🧪 Unit & Integration Tests"
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI .env
        run: |
          cat > .env << 'EOF'
          DJANGO_SETTINGS_MODULE=darasa_project.settings
          SECRET_KEY=ci-insecure-key-aabbccddeeff00112233445566778899
          DEBUG=0
          DB_HOST=db
          DB_NAME=darasa_ci
          DB_USER=darasa_ci_user
          DB_PASS=ci_db_pass
          REDIS_URL=redis://redis:6379/1
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          JWT_SIGNING_KEY=ci-jwt-signing-key-must-be-32-bytes-min!!
          FERNET_SECRET_KEY=ci-fernet-key-replace-in-real-env-AAAA=
          TENANT_DEFAULT_SCHEMA=public
          TOXIPROXY_HOST=toxiproxy
          TOXIPROXY_API_PORT=8474
          TOXIPROXY_DB_PORT=5433
          TOXIPROXY_REDIS_PORT=6380
          EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
          DJANGO_LOG_LEVEL=WARNING
          TESTING=1
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Build images
        run: docker compose build --parallel
        timeout-minutes: 20

      - name: Start infrastructure (DB + Redis + Toxiproxy)
        run: |
          docker compose up -d db redis toxiproxy
          echo "Waiting for services to be healthy..."
          for i in $(seq 1 60); do
            DB=$(docker compose ps db --format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health','unknown'))" 2>/dev/null || echo "starting")
            RD=$(docker compose ps redis --format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health','unknown'))" 2>/dev/null || echo "starting")
            TX=$(docker compose ps toxiproxy --format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health','unknown'))" 2>/dev/null || echo "starting")
            echo "  [${i}s] db=${DB} redis=${RD} toxiproxy=${TX}"
            [ "$DB" = "healthy" ] && [ "$RD" = "healthy" ] && [ "$TX" = "healthy" ] && echo "✅ All healthy" && break
            sleep 2
          done
        timeout-minutes: 5

      - name: "Unit Tests (no DB, fast)"
        run: docker compose run --rm test unit
        timeout-minutes: 15

      - name: "Integration Tests (DB + Redis)"
        run: docker compose run --rm test integration
        timeout-minutes: 20

      - name: "Coverage Report"
        run: docker compose run --rm test coverage
        timeout-minutes: 25

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/htmlcov/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # ============================================================================
  # JOB 4: SECURITY & MULTI-TENANCY TESTS
  # DIAGNOSTIC: runs independently — failure here doesn't block Celery report
  # ============================================================================
  test-security:
    name: "🔒 Security & Tenant Isolation"
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI .env
        run: |
          cat > .env << 'EOF'
          DJANGO_SETTINGS_MODULE=darasa_project.settings
          SECRET_KEY=ci-insecure-key-aabbccddeeff00112233445566778899
          DEBUG=0
          DB_HOST=db
          DB_NAME=darasa_ci
          DB_USER=darasa_ci_user
          DB_PASS=ci_db_pass
          REDIS_URL=redis://redis:6379/1
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          JWT_SIGNING_KEY=ci-jwt-signing-key-must-be-32-bytes-min!!
          FERNET_SECRET_KEY=ci-fernet-key-replace-in-real-env-AAAA=
          TENANT_DEFAULT_SCHEMA=public
          TOXIPROXY_HOST=toxiproxy
          TOXIPROXY_API_PORT=8474
          TOXIPROXY_DB_PORT=5433
          TOXIPROXY_REDIS_PORT=6380
          EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
          DJANGO_LOG_LEVEL=WARNING
          TESTING=1
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Build images
        run: docker compose build --parallel
        timeout-minutes: 20

      - name: Start infrastructure
        run: |
          docker compose up -d db redis toxiproxy
          for i in $(seq 1 60); do
            DB=$(docker compose ps db --format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health','unknown'))" 2>/dev/null || echo "starting")
            RD=$(docker compose ps redis --format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health','unknown'))" 2>/dev/null || echo "starting")
            TX=$(docker compose ps toxiproxy --format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health','unknown'))" 2>/dev/null || echo "starting")
            [ "$DB" = "healthy" ] && [ "$RD" = "healthy" ] && [ "$TX" = "healthy" ] && echo "✅ All healthy" && break
            sleep 2
          done
        timeout-minutes: 5

      - name: "Security Tests (IDOR, JWT, Fernet, Tenant Bleed)"
        run: docker compose run --rm test security
        timeout-minutes: 20

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # ============================================================================
  # JOB 5: ASYNC / CELERY PIPELINE TESTS
  # ============================================================================
  test-celery:
    name: "⚙️ Async & Celery Pipeline"
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI .env
        run: |
          cat > .env << 'EOF'
          DJANGO_SETTINGS_MODULE=darasa_project.settings
          SECRET_KEY=ci-insecure-key-aabbccddeeff00112233445566778899
          DEBUG=0
          DB_HOST=db
          DB_NAME=darasa_ci
          DB_USER=darasa_ci_user
          DB_PASS=ci_db_pass
          REDIS_URL=redis://redis:6379/1
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          JWT_SIGNING_KEY=ci-jwt-signing-key-must-be-32-bytes-min!!
          FERNET_SECRET_KEY=ci-fernet-key-replace-in-real-env-AAAA=
          TENANT_DEFAULT_SCHEMA=public
          TOXIPROXY_HOST=toxiproxy
          TOXIPROXY_API_PORT=8474
          TOXIPROXY_DB_PORT=5433
          TOXIPROXY_REDIS_PORT=6380
          EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
          DJANGO_LOG_LEVEL=WARNING
          TESTING=1
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Build images
        run: docker compose build --parallel
        timeout-minutes: 20

      - name: Start infrastructure
        run: |
          docker compose up -d db redis toxiproxy
          for i in $(seq 1 60); do
            DB=$(docker compose ps db --format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health','unknown'))" 2>/dev/null || echo "starting")
            RD=$(docker compose ps redis --format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health','unknown'))" 2>/dev/null || echo "starting")
            [ "$DB" = "healthy" ] && [ "$RD" = "healthy" ] && echo "✅ All healthy" && break
            sleep 2
          done
        timeout-minutes: 5

      - name: "Celery Task Pipeline Tests"
        run: docker compose run --rm test celery
        timeout-minutes: 20

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # ============================================================================
  # JOB 6: CHAOS ENGINEERING (Toxiproxy fault injection)
  # ============================================================================
  test-chaos:
    name: "💥 Chaos Engineering (Toxiproxy)"
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI .env
        run: |
          cat > .env << 'EOF'
          DJANGO_SETTINGS_MODULE=darasa_project.settings
          SECRET_KEY=ci-insecure-key-aabbccddeeff00112233445566778899
          DEBUG=0
          DB_HOST=db
          DB_NAME=darasa_ci
          DB_USER=darasa_ci_user
          DB_PASS=ci_db_pass
          REDIS_URL=redis://redis:6379/1
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          JWT_SIGNING_KEY=ci-jwt-signing-key-must-be-32-bytes-min!!
          FERNET_SECRET_KEY=ci-fernet-key-replace-in-real-env-AAAA=
          TENANT_DEFAULT_SCHEMA=public
          TOXIPROXY_HOST=toxiproxy
          TOXIPROXY_API_PORT=8474
          TOXIPROXY_DB_PORT=5433
          TOXIPROXY_REDIS_PORT=6380
          EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
          DJANGO_LOG_LEVEL=WARNING
          TESTING=1
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Build images
        run: docker compose build --parallel
        timeout-minutes: 20

      - name: Start infrastructure
        run: |
          docker compose up -d db redis toxiproxy
          for i in $(seq 1 90); do
            TX=$(docker compose ps toxiproxy --format json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health','unknown'))" 2>/dev/null || echo "starting")
            [ "$TX" = "healthy" ] && echo "✅ Toxiproxy healthy" && break
            sleep 2
          done
        timeout-minutes: 5

      - name: "Chaos / Fault Injection Tests"
        run: docker compose run --rm test chaos
        timeout-minutes: 30

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # ============================================================================
  # JOB 7: MUTATION TESTING (mutmut) — HARD GATE
  # Runs only after unit+integration pass. Surviving mutants = build failure.
  # ============================================================================
  mutation:
    name: "☢️ Mutation Testing (mutmut)"
    runs-on: ubuntu-latest
    # Mutation only runs if unit tests passed — no point mutating broken code
    needs: [test-unit]
    if: needs.test-unit.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI .env
        run: |
          cat > .env << 'EOF'
          DJANGO_SETTINGS_MODULE=darasa_project.settings
          SECRET_KEY=ci-insecure-key-aabbccddeeff00112233445566778899
          DEBUG=0
          DB_HOST=db
          DB_NAME=darasa_ci
          DB_USER=darasa_ci_user
          DB_PASS=ci_db_pass
          REDIS_URL=redis://redis:6379/1
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          JWT_SIGNING_KEY=ci-jwt-signing-key-must-be-32-bytes-min!!
          FERNET_SECRET_KEY=ci-fernet-key-replace-in-real-env-AAAA=
          TENANT_DEFAULT_SCHEMA=public
          TOXIPROXY_HOST=toxiproxy
          TOXIPROXY_API_PORT=8474
          TOXIPROXY_DB_PORT=5433
          TOXIPROXY_REDIS_PORT=6380
          EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
          DJANGO_LOG_LEVEL=WARNING
          TESTING=1
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Build images
        run: docker compose build --parallel
        timeout-minutes: 20

      - name: Start infrastructure
        run: docker compose up -d db redis toxiproxy
        timeout-minutes: 5

      - name: "mutmut — Run mutation tests"
        run: docker compose run --rm test mutation
        timeout-minutes: 60

      - name: "mutmut — Check for surviving mutants (HARD GATE)"
        run: |
          docker compose run --rm --entrypoint="" test sh -c "
            python -m mutmut results 2>&1 | tee /tmp/mutmut-results.txt
            SURVIVED=\$(python -m mutmut results 2>/dev/null | grep -c 'survived' || true)
            echo \"Surviving mutants: \${SURVIVED}\"
            if [ \"\$SURVIVED\" -gt '0' ]; then
              echo '❌ MUTATION GATE FAILED: Surviving mutants detected.'
              echo 'These mutants represent logic your tests did NOT catch.'
              cat /tmp/mutmut-results.txt
              exit 1
            fi
            echo '✅ Mutation gate passed — zero surviving mutants.'
          "
        timeout-minutes: 5

      - name: Upload mutmut results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutmut-results
          path: .mutmut-cache
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # ============================================================================
  # JOB 8: FINAL GATE — Summary job that GitHub branch protection rules key on
  # ============================================================================
  ci-gate:
    name: "✅ CI Gate"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - test-unit
      - test-security
      - test-celery
      - test-chaos
      - mutation
    steps:
      - name: Evaluate diagnostic results
        run: |
          echo "========================================"
          echo "  Darasa-Core Diagnostic CI Summary"
          echo "========================================"
          echo "  Lint:          ${{ needs.lint.result }}"
          echo "  Unit/Integ:    ${{ needs.test-unit.result }}"
          echo "  Security:      ${{ needs.test-security.result }}"
          echo "  Celery:        ${{ needs.test-celery.result }}"
          echo "  Chaos:         ${{ needs.test-chaos.result }}"
          echo "  Mutation:      ${{ needs.mutation.result }}"
          echo "========================================"

          # Hard fail if any critical gate failed
          if [[ "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.test-unit.result }}" == "failure" || \
                "${{ needs.test-security.result }}" == "failure" || \
                "${{ needs.mutation.result }}" == "failure" ]]; then
            echo "❌ CRITICAL GATE FAILED — merge is blocked."
            exit 1
          fi

          # Warn (not block) if chaos/celery failed — these are flaky by nature
          if [[ "${{ needs.test-celery.result }}" == "failure" || \
                "${{ needs.test-chaos.result }}" == "failure" ]]; then
            echo "⚠️  WARNING: Celery or Chaos tests failed. Review before merging."
          fi

          echo "✅ All critical gates passed."
