name: Darasa-Core DAST (OWASP ZAP)

on:
  workflow_dispatch: {}
  schedule:
    # Weekly, not per-push: a full dynamic scan is slow and this repo's real
    # HTTP surface changes infrequently. See docs/security/ZAP_DAST_STRATEGY.md.
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.3.4"
  SCAN_DOMAIN: "scan.localhost"

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      DJANGO_SETTINGS_MODULE: darasa_project.settings
      PYTHONPATH: app
      SECRET_KEY: dast-scan-secret-key-not-for-runtime-use
      DEBUG: "1"
      ALLOWED_HOSTS: 127.0.0.1,scan.localhost
      CSRF_TRUSTED_ORIGINS: http://scan.localhost:8000
      POSTGRES_DB: darasa_core
      POSTGRES_USER: darasa
      POSTGRES_PASSWORD: darasa
      DATABASE_URL: postgresql://darasa:darasa@127.0.0.1:5432/darasa_core
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      JWT_SIGNING_KEY: dast-jwt-signing-key-at-least-32-bytes-long
      # Local/CI DAST-scan sample only. Never reuse in a real environment.
      FERNET_ENCRYPTION_KEY: ZGFyYXNhLWNvcmUtbG9jYWwtZGV2LWtleS0wMDAxMjM=
      TENANT_PUBLIC_SCHEMA_NAME: public
      DJANGO_LOG_LEVEL: WARNING
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      # Metrics endpoint stays closed (no token configured) even during the
      # scan, exactly as it would outside DEBUG/TESTING in a real deployment.
      METRICS_ACCESS_TOKEN: ""
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: darasa_core
          POSTGRES_USER: darasa
          POSTGRES_PASSWORD: darasa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darasa -d darasa_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: python -m pip install "poetry==${POETRY_VERSION}"

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --no-root --with dev

      - name: Apply shared-schema migrations
        run: poetry run python app/manage.py migrate_schemas --shared --noinput

      - name: Provision disposable scan tenant
        run: |
          poetry run python app/manage.py provision_local_tenant \
            --domain "${SCAN_DOMAIN}" \
            --admin-email "scan-${{ github.run_id }}@darasa.local" \
            --admin-password "scan-only-${{ github.run_id }}-not-a-real-credential" \
            --skip-if-exists

      - name: Start Django dev server
        run: |
          nohup poetry run python app/manage.py runserver 0.0.0.0:8000 --noreload \
            > /tmp/django.log 2>&1 &
          echo $! > /tmp/django.pid

      - name: Wait for server readiness
        run: |
          for _ in $(seq 1 30); do
            if curl -sf -H "Host: ${SCAN_DOMAIN}" http://127.0.0.1:8000/api/health/ \
                > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready in time"
          cat /tmp/django.log
          exit 1

      - name: Route the scan domain to the running server
        run: echo "127.0.0.1 ${SCAN_DOMAIN}" | sudo tee -a /etc/hosts

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://${{ env.SCAN_DOMAIN }}:8000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
          fail_action: true
          allow_issue_writing: false
          artifact_name: "zap-baseline-report"

      - name: Show Django logs on failure
        if: failure()
        run: cat /tmp/django.log || true
