[tool.poetry]
name = "darasa-core"
version = "0.1.0"
description = "Deterministic backend foundation for the Darasa-Core educational ERP."
authors = ["Back To Front Development <engineering@backtofront.dev>"]
license = "Proprietary"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
django = ">=5.2,<5.3"
django-environ = ">=0.11,<1.0"
django-tenants = ">=3.7,<4.0"
django-cors-headers = ">=4.4,<5.0"
django-celery-beat = ">=2.6,<3.0"
django-celery-results = ">=2.5,<3.0"
djangorestframework = ">=3.15,<3.17"
djangorestframework-simplejwt = ">=5.3,<6.0"
drf-spectacular = ">=0.27,<1.0"
psycopg = { version = ">=3.2,<4.0", extras = ["binary"] }
celery = { version = ">=5.4,<6.0", extras = ["redis"] }
redis = ">=5.0,<7.0"
gunicorn = ">=22.0,<24.0"
cryptography = ">=46.0.7,<47.0"
argon2-cffi = ">=23.1,<26.0"
whitenoise = ">=6.6,<7.0"
structlog = ">=24.1,<26.0"
opentelemetry-api = ">=1.24,<2.0"
opentelemetry-sdk = ">=1.24,<2.0"
opentelemetry-exporter-otlp = ">=1.24,<2.0"
opentelemetry-instrumentation-celery = ">=0.45b0,<1.0"
opentelemetry-instrumentation-django = ">=0.45b0,<1.0"
opentelemetry-instrumentation-psycopg = ">=0.45b0,<1.0"
prometheus-client = ">=0.20,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0"
pytest-django = ">=4.8,<5.0"
pytest-cov = ">=5.0,<8.0"
coverage = { version = ">=7.5,<8.0", extras = ["toml"] }
hypothesis = ">=6.100,<7.0"
factory-boy = ">=3.3,<4.0"
freezegun = ">=1.5,<2.0"
flake8 = ">=7.0,<8.0"
mutmut = ">=2.5,<4.0"

[tool.poetry.group.security.dependencies]
bandit = { version = ">=1.7,<2.0", extras = ["toml"] }
pip-audit = ">=2.7,<3.0"

[tool.poetry.group.chaos.dependencies]
toxiproxy-python = ">=0.0.2,<1.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "darasa_project.settings"
pythonpath = ["app"]
testpaths = ["app"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-config --strict-markers --tb=short"
markers = [
    "unit: deterministic tests that do not require network access",
    "phase1: foundation-safe tests for Phase 1 CI",
    "phase2: tenant/core identity and access-control foundation tests",
    "phase3: academics domain tests",
    "phase4: curriculum and rubric domain tests",
    "phase5: event backbone and async boundary tests",
    "phase6: grading engine and assessment workflow tests",
    "future: tests intentionally deferred from the current phase",
    "integration: tests that require database, cache, or task infrastructure",
    "security: authorization, isolation, and misuse-resistance tests",
    "chaos: opt-in fault-injection tests that use Toxiproxy",
    "slow: tests that are intentionally slower than the default test gate",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/apps.py",
    "*/admin.py",
    "*/manage.py",
    "*/settings*.py",
    "*/asgi.py",
    "*/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = [
    ".venv",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".tmpdeps",
    "__pycache__",
    "build",
    "dist",
    "htmlcov",
    "conftest.py",
    "app/conftest.py",
    "migrations",
    "tests",
    "app/*/migrations",
    "app/*/tests",
]

[tool.mutmut]
paths_to_mutate = "app"
backup = false
runner = "python -m pytest -q"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
