name: darasa-core

x-darasa-build: &darasa-build
  context: .
  dockerfile: Dockerfile
  args:
    APP_UID: ${HOST_UID:-1000}
    APP_GID: ${HOST_GID:-1000}
    POETRY_INSTALL_ARGS: "--with dev,security,chaos"

x-django-environment: &django-environment
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-darasa_project.settings}
  PYTHONPATH: /app
  SECRET_KEY: ${SECRET_KEY:-change-me-local-development-secret-key}
  DEBUG: ${DARASA_DEBUG:-0}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,django}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:-postgresql://darasa:darasa@postgres:5432/darasa_core}
  POSTGRES_DB: ${POSTGRES_DB:-darasa_core}
  POSTGRES_USER: ${POSTGRES_USER:-darasa}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darasa}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CACHE_URL: ${CACHE_URL:-redis://redis:6379/1}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/2}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/3}
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-0}
  FERNET_ENCRYPTION_KEY: ${FERNET_ENCRYPTION_KEY:-CHANGE-ME-generate-with-python-cryptography-fernet}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-change-me-jwt-signing-key-at-least-32-bytes}
  TENANT_PUBLIC_SCHEMA_NAME: ${TENANT_PUBLIC_SCHEMA_NAME:-public}
  TOXIPROXY_HOST: ${TOXIPROXY_HOST:-toxiproxy}
  TOXIPROXY_API_PORT: ${TOXIPROXY_API_PORT:-8474}
  TOXIPROXY_API_URL: ${TOXIPROXY_API_URL:-http://toxiproxy:8474}
  TOXIPROXY_POSTGRES_PROXY_NAME: ${TOXIPROXY_POSTGRES_PROXY_NAME:-postgres}
  TOXIPROXY_POSTGRES_HOST: ${TOXIPROXY_POSTGRES_HOST:-toxiproxy}
  TOXIPROXY_POSTGRES_PORT: ${TOXIPROXY_POSTGRES_PORT:-15432}
  TOXIPROXY_REDIS_PROXY_NAME: ${TOXIPROXY_REDIS_PROXY_NAME:-redis}
  TOXIPROXY_REDIS_HOST: ${TOXIPROXY_REDIS_HOST:-toxiproxy}
  TOXIPROXY_REDIS_PORT: ${TOXIPROXY_REDIS_PORT:-16379}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-darasa-core}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
  PROMETHEUS_MULTIPROC_DIR: ${PROMETHEUS_MULTIPROC_DIR:-/tmp/prometheus}

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-darasa_core}
      POSTGRES_USER: ${POSTGRES_USER:-darasa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darasa}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "${TOXIPROXY_API_HOST_PORT:-8474}:8474"
      - "${TOXIPROXY_POSTGRES_HOST_PORT:-5433}:15432"
      - "${TOXIPROXY_REDIS_HOST_PORT:-6380}:16379"
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  django:
    build: *darasa-build
    command: ["bash", "/scripts/run.sh"]
    environment:
      <<: *django-environment
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - ./app:/app
      - ./scripts:/scripts:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./.flake8:/app/.flake8:ro
      - static-data:/vol/web/static
      - media-data:/vol/web/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started

  celery-worker:
    build: *darasa-build
    command: ["celery", "-A", "darasa_project", "worker", "--loglevel=${CELERY_LOG_LEVEL:-info}"]
    environment:
      <<: *django-environment
    volumes:
      - ./app:/app
      - ./scripts:/scripts:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./.flake8:/app/.flake8:ro
      - static-data:/vol/web/static
      - media-data:/vol/web/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started

  celery-beat:
    build: *darasa-build
    command: ["celery", "-A", "darasa_project", "beat", "--loglevel=${CELERY_LOG_LEVEL:-info}", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *django-environment
    volumes:
      - ./app:/app
      - ./scripts:/scripts:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./.flake8:/app/.flake8:ro
      - static-data:/vol/web/static
      - media-data:/vol/web/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  static-data:
  media-data:
