[pytest]
DJANGO_SETTINGS_MODULE = darasa_project.settings
python_files = test_*.py *_tests.py
testpaths = core tenant academics grading curriculum disciplinary portals bus
addopts = -ra
cache_dir = /home/django-user/.pytest_cache
markers =
    celery: Celery-focused contract and worker behavior tests.
    slow: Tests that intentionally exercise throttling or longer-running flows.
    unit: Pure unit tests with all network boundaries mocked.
    integration: Tests that require the database or Redis.
    security: Tenant isolation, auth, and hardening tests.
    chaos: Toxiproxy fault-injection tests.